# Compila la APK de Control PC con GitHub gratis — sin Android Studio.
#
# Dos maneras para el que entra a este proyecto:
#   1) Actions → "APK" → Run workflow  → descarga el artefacto "controlpc-apk"
#   2) Si activas la casilla "Publicar en Releases", la APK queda en la pestaña
#      Releases del repo, disponible para CUALQUIER persona sin cuenta de GitHub.
name: APK

on:
  workflow_dispatch:
    inputs:
      crear_release:
        description: "Publicar también en Releases (descarga pública)"
        type: boolean
        default: false
  push:
    branches: [main, master]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VER }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Leer versión (de pubspec.yaml)
        id: version
        run: |
          VER=$(grep '^version:' apk-flutter/pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VER=$VER" >> "$GITHUB_OUTPUT"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generar estructura de Android
        run: |
          cd apk-flutter
          flutter create . --org com.controlpc.app --project-name controlpc --platforms=android
          flutter pub get
          # Los plugins modernos piden compileSdk 34+: fuerza las versiones
          if [ -f android/app/build.gradle ]; then
            sed -i \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              -e 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              -e 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 23/' \
              -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' \
              android/app/build.gradle || true
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i \
              -e 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              -e 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 23/' \
              android/app/build.gradle.kts || true
          fi
          fdim=$(ls -d ~/.pub-cache/hosted/pub.dev/flutter_pcm_sound-* 2>/dev/null | head -1)
          if [ -n "$fdim" ] && [ -f "$fdim/android/build.gradle" ]; then
            sed -i -E 's/compileSdk(Version)?( )?=?( )?33/compileSdkVersion 36/g' "$fdim/android/build.gradle" || true
          fi
          # MainActivity con captura de micrófono NATIVA (canal propio, sin paquetes externos)
          MK=$(find android/app/src/main/kotlin -name MainActivity.kt)
          cp android_parches/MainActivity.kt "$MK"
          # network security config: HTTP claro permitido (servidor local http://)
          if [ ! -f android/app/src/main/res/xml/network_security_config.xml ]; then
            mkdir -p android/app/src/main/res/xml
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<network-security-config>' \
              '    <base-config cleartextTrafficPermitted="true" />' \
              '</network-security-config>' \
              > android/app/src/main/res/xml/network_security_config.xml
          fi
          if ! grep -q "networkSecurityConfig" android/app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<application\n    android:networkSecurityConfig="@xml\/network_security_config"/' android/app/src/main/AndroidManifest.xml
          fi
          # permiso de INTERNET (la plantilla flutter no lo agrega en release)
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          # micrófono y cámara (los dos permisos del teléfono)
          if ! grep -q "android.permission.RECORD_AUDIO" android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<uses-permission android:name="android.permission.INTERNET"/>#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>#' android/app/src/main/AndroidManifest.xml
          fi
          if ! grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.CAMERA"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          grep -cE "permissions:|permission\." android/app/src/main/AndroidManifest.xml || true
          # http en claro (redundante con la NSC, asegura compatibilidad)
          if ! grep -q "usesCleartextTraffic" android/app/src/main/AndroidManifest.xml; then
            sed -i '0,/<application/s//<application\n    android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          fi
          grep -E "networkSecurityConfig|usesCleartextTraffic|permission.INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Compilar APK (release)
        run: |
          cd apk-flutter
          flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: controlpc-apk
          path: apk-flutter/build/app/outputs/flutter-apk/app-release.apk

  publicar:
    needs: compilar
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && github.event.inputs.crear_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: controlpc-apk
          path: apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.compilar.outputs.version }}
          name: Control PC — versión ${{ needs.compilar.outputs.version }}
          body: |
            APK nativa de Control PC (Android).
            Instálala en el teléfono y conéctala al servidor de tu PC (ver README).
          files: apk/app-release.apk
